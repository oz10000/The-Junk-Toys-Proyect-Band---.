name: 🔬 Verificar Exchanges
on: [workflow_dispatch, schedule: [{cron: '0 */12 * * *'}]]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install ccxt pandas yfinance
      - run: python scripts/verify_exchanges.py
      - uses: actions/upload-artifact@v4
        with:
          name: exchange-report
          path: exchange_verification_report.json